<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% block title %}
        {% endblock %}

        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>

        <!-- adding css styles -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&family=Supermercado+One&display=swap">

        <link href="{{ url_for('static', path='styles/bootstrap.min.css') }}" rel="stylesheet">
        <link href="{{ url_for('static', path='styles/app.css') }}" rel="stylesheet">
        <link href="{{ url_for('static', path='styles/prism.css') }}" rel="stylesheet">
        <link href="{{ url_for('static', path='favicon.ico') }}" rel="shortcut icon">
    </head>

<style>
    body{ min-height: 100vh; }
</style>

    <body>
         <nav class="navbar navbar-expand-md navbar-light" style="background-color: #42A5F5;">
            <div class="container-fluid d-flex justify-content-center">
                <div class="col-12 text-center navbar-brand mt-3">
                    <img src="{{ url_for('static', path='images/future_prog.png') }}" alt="" width="85" height="70">
                    <br><p class="fs-3 fw-bolder text-light animate__animated animate__fadeInDown animate__delay-1s">Future Programmers</p>
                </div>
            </div> 
        </nav>

        {% block content %}
        {% endblock %}

        {% include "footer_help.html" %}

        <!-- adding javascripts -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
        

        <script src="{{url_for("static", path="scripts/inputs_validate.js")}}"></script>
        <script src="{{url_for("static", path="scripts/inputs_mask.js")}}"></script>
    </body>
</html>
