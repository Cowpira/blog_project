<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>FP - Request Limit Exceeded</title>
        <!-- adding css styles -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">	
        <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&family=Supermercado+One&display=swap" rel="stylesheet">
        <link href="{{ url_for('static', path='styles/bootstrap.min.css') }}" rel="stylesheet">
        <link href="{{ url_for('static', path='styles/app.css') }}" rel="stylesheet">
        <link href="{{ url_for('static', path='styles/prism.css') }}" rel="stylesheet">
        <link href="{{ url_for('static', path='favicon.ico') }}" rel="shortcut icon">
    </head>

    <style>
        body{
            min-height: 100vh;   
            max-height: 100%; 
            width: 100%; 
            overflow-x: hidden; 
            overflow-y: auto; 
            background: #dcdcdc;
            background: linear-gradient(0deg,rgba(122, 122, 122, 0.85) 8%, rgb(188, 188, 188) 34%, rgb(214, 214, 214) 53%, rgba(245, 245, 245, 1) 76%);
        }
        .menu{
            margin-bottom: 3.543rem;
            background-color: rgba(205, 205, 205, 0.877);
            box-shadow: rgba(50, 50, 93, 0.25) 0px 13px 27px -5px, rgba(0, 0, 0, 0.3) 0px 8px 16px -8px;
        }
    </style>

    <body>
        <nav class="navbar menu">
            <div class="container-fluid">
                <img class="ms-3" src="{{ url_for('static', path='images/future_prog.png') }}" alt="" width="85" height="70">
                    
                <a class="nav-link fs-5 fw-light" href="/">
                    <i class="bi bi-house-fill px-2" style="font-size: 2rem;"></i>
                </a>
            </div>
        </nav>

        <main class="container-fluid">
            <div class="row d-flex justify-content-center">
                {% if result.status_code == 429 %}
                    <div class="col-10 alert alert-dismissible text-center fw-bolder animate__animated animate__fadeInDown"
                        style="background-color: #FF1744; color: #faf9f9;">
                        
                        <button type="button" class="btn-close animate__animated animate__fadeIn animate__delay-1s" 
                            data-bs-dismiss="alert" aria-label="Close"></button>

                        <i class="{{result.detail[0]}} fw-bolder animate__animated animate__flash animate__delay-2s animate__repeat-3" 
                            style="font-size: 1.5rem;"></i> <br> {{result.detail[1]}} !!!
                    </div>
                {% endif %}

                <div class="col-12 col-sm-9 col-md-8 col-lg-6">
                    <img class="img-fluid" src="{{ url_for('static', path='/images/backgrounds/time_limit.gif') }}" alt="...">
                </div>

                <div class="col-12 text-center p-2">
                    <div class="fs-4 animate__animated animate__fadeInUp animate__slow animate__delay-1s">
                        Exceeded request limit to <br>
                        <h1 class="text-center fw-bolder text-orange">{{result.detail[2]}}</h1>
                    </div>
                    
                    <div class="col-12 text-center mt-3 animate__animated animate__fadeInDown animate__delay-3s animate__slow">
                        <a href="{{url_for("home")}}" class="fp-buttons fp-orange-btn fs-5"> 
                            <i class="bi bi-house-door-fill"></i> Home
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
